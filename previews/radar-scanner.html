<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PreloadX - Neon Radar Scanner Preview</title>
    <link rel="stylesheet" href="../src/assets/css/preloadx-style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --preloader-color: #00e5ff;
            --preloader-size: 100px;
            --preloader-radius: 12px;
            --preloader-font-size: 36px;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #141e33 0%, #080d1a 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .pxpreloader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }
        .preview-badge {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            padding: 10px 22px;
            border-radius: 9999px;
            color: #f8fafc;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.03em;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 1000000;
            pointer-events: auto;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .preview-badge:hover {
            background: rgba(15, 23, 42, 0.95);
            border-color: rgba(0, 229, 255, 0.4);
            box-shadow: 0 10px 30px -5px rgba(0, 229, 255, 0.25);
        }
        .preview-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00e5ff;
            box-shadow: 0 0 10px #00e5ff;
        }
    </style>
</head>
<body>
    <div class="pxpreloader">
        <div id="radar-scanner-loader">
            <div class="px-radar">
                <div class="px-radar-sweep"></div>
                <div class="px-radar-ring"></div>
                <div class="px-radar-center"></div>
            </div>
        </div>
    </div>
    <a href="index.html" class="preview-badge">
        <span class="preview-dot"></span>
        <span>PreloadX • Neon Radar Scanner</span>
    </a>
</body>
</html>
